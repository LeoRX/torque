name: Build & Publish Docker Image

on:
  push:
    branches:
      - main

# Every third-party action is pinned to a full commit SHA (tag in the comment) so a
# moved or compromised tag can't change what runs with the Docker Hub token.
# Dependabot (.github/dependabot.yml) opens PRs to bump these pins.

jobs:
  build-and-push:
    name: Lint, test, scan, build, push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload Trivy SARIF to the Security tab

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # ── PHP lint ──────────────────────────────────────────────────────────────
      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'

      - name: PHP syntax check
        run: |
          echo "Checking PHP syntax..."
          find . -name "*.php" \
            ! -path "./.git/*" \
            -print0 | xargs -0 -n1 php -l
          echo "All PHP files OK."

      # ── Unit tests ────────────────────────────────────────────────────────────
      - name: Unit tests
        run: |
          for t in tests/test_*.php; do
            echo "── $t"
            php "$t"
          done

      # ── Secret scan ───────────────────────────────────────────────────────────
      # Fail the build if any PHP file contains what looks like a real credential.
      # creds.php is gitignored so it can't be committed, but this is a safety net.
      # Notes on patterns chosen:
      #   AIzaSy   — Google API key prefix (39-char key follows)
      #   dckr_pat_ — Docker Hub personal access token prefix
      #   ghp_      — GitHub personal access token prefix
      #   sk-ant- is intentionally excluded: it appears in placeholder/help text
      #   in settings.php and get_settings.php, which are not actual credentials.
      - name: Secret scan
        run: |
          echo "Scanning for accidental credentials..."
          if grep -rn --include="*.php" \
            -e "AIzaSy" \
            -e "dckr_pat_" \
            -e "ghp_" \
            .; then
            echo "ERROR: Credential pattern found in committed PHP file." >&2
            exit 1
          fi
          echo "Secret scan passed."

      # ── Docker metadata ───────────────────────────────────────────────────────
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: leorx/open-torque-viewer
          tags: |
            type=raw,value=latest
            type=raw,value={{date 'YYYY-MM-DD'}}

      # ── Set up Docker Buildx (needed for GHA cache backend) ──────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # ── Docker Hub login ──────────────────────────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Vulnerability scan BEFORE anything is published ──────────────────────
      # Build the amd64 image locally, report all findings to the Security tab,
      # and block the release only on CRITICAL vulnerabilities that have a fix
      # (ignore-unfixed) — so an unpatched upstream CVE can't stall an emergency
      # deploy, but a fixable critical one can't ship.
      - name: Build amd64 image for scanning
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          pull: true
          tags: open-torque-viewer:scan
          cache-from: type=registry,ref=leorx/open-torque-viewer:buildcache

      - name: Trivy scan (report to Security tab)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: open-torque-viewer:scan
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '0'

      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      - name: Trivy gate (fixable CRITICAL blocks the release)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: open-torque-viewer:scan
          format: table
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: '1'
          skip-setup-trivy: true

      # ── QEMU for cross-platform build (arm64 on amd64 runner) ───────────────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64

      # ── Build & push multi-arch :latest + date tag (amd64 + arm64) ──────────
      - name: Build and push multi-arch image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64/v8
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=leorx/open-torque-viewer:buildcache
          cache-to: type=registry,ref=leorx/open-torque-viewer:buildcache,mode=max

      # ── Build & push single-platform :arm64 tag ───────────────────────────────
      # Some Docker daemons (e.g. on ARM NAS) strictly require variant="v8" in the
      # manifest list but buildx QEMU cross-builds leave the variant field empty.
      # A single-platform image has no manifest list, so variant matching is
      # bypassed entirely. The NAS Portainer stack uses this tag.
      - name: Build and push arm64-only image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          platforms: linux/arm64/v8
          push: true
          pull: true
          tags: leorx/open-torque-viewer:arm64
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=leorx/open-torque-viewer:buildcache
